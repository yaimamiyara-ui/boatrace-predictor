# 定時起動の再登録（2026-11-12、ユーザーのコミット）
name: Live Record

# 当日データの記録（時計役 scheduler が呼ぶ）。公式サイトにはアクセスせず、
# 自宅PCがGoogleドライブに置いた生ファイルを読む。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "schedule / prerace / final"
        required: true
        default: "prerace"
      date:
        description: "対象日 YYYY-MM-DD（空欄で自動）"
        required: false
        default: ""

concurrency:
  group: live-record
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}
      - name: Decide mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_DATE: ${{ inputs.date }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "mode=$IN_MODE" >> "$GITHUB_OUTPUT"; echo "date=$IN_DATE" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "41 22 * * *" ]; then
            echo "mode=schedule" >> "$GITHUB_OUTPUT"; echo "date=" >> "$GITHUB_OUTPUT"
          elif [ "$SCHED" = "21 15 * * *" ]; then
            echo "mode=final" >> "$GITHUB_OUTPUT"; echo "date=$(TZ=Asia/Tokyo date -d yesterday +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "mode=prerace" >> "$GITHUB_OUTPUT"; echo "date=" >> "$GITHUB_OUTPUT"
          fi
      - name: Record
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DAY: ${{ steps.mode.outputs.date }}
        run: |
          if [ -n "$DAY" ]; then python scripts/live_record.py "$MODE" --date "$DAY"; else python scripts/live_record.py "$MODE"; fi
