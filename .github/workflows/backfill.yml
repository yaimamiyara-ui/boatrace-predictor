name: Backfill Historical Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "開始日 (YYYY-MM-DD)"
        required: true
        type: string
        default: "2024-05-01"
      end_date:
        description: "終了日 (YYYY-MM-DD、1回で約5年分まで。途中で止まっても再実行すれば続きから)"
        required: true
        type: string
        default: "2024-05-31"

concurrency:
  group: gdrive-parquet-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          pip install -r requirements.txt

      - name: Install and configure rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Run backfill script
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: python scripts/backfill.py --start-date "$START_DATE" --end-date "$END_DATE"
