name: Parse Check

# パーサー確認用（手動実行）。公式ファイルの先頭行とパース件数をログに出す。
# Googleドライブには書き込まない。
on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYY-MM-DD)"
        required: true
        type: string
        default: "2026-11-10"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          pip install -r requirements.txt
      - name: Run parse check
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: python scripts/parse_check.py --date "$TARGET_DATE"
