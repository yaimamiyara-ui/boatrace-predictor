name: Backfill Auto

# 過去データ（2012年〜）の取りこぼしを毎朝5:17 JSTに確認し、残りがあれば続きから取得する。
# 全期間そろった後は、取りこぼしの確認だけをして1分ほどで終わる。
on:
  schedule:
    # 並列の一括取得（backfill-fast）と重ならないよう、普段は1日1回の取りこぼし確認にする
    - cron: "17 20 * * *"
  workflow_dispatch:

concurrency:
  group: gdrive-parquet-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          pip install -r requirements.txt

      - name: Install and configure rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Run auto backfill
        run: python scripts/backfill_auto.py --budget-min 45
